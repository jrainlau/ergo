name: Build & Release

# 推送到 main：构建并发布一个预发布版本（build-<序号>）。
# 推送 v* 标签（如 v0.2.0）：构建并发布正式版本。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # xcode-27 是预装 Xcode 27 的 macOS 运行器（公开预览），与本地开发环境一致
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 运行测试
        run: swift test --package-path Packages/ErgoKit

      - name: 生成工程
        run: xcodegen generate

      - name: 构建 Release（不签名）
        run: |
          xcodebuild \
            -project Ergo.xcodeproj \
            -scheme Ergo \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Ad-hoc 签名
        run: |
          APP="build/Build/Products/Release/Ergo.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: 计算版本号
        id: version
        run: |
          MARKETING=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            NAME="Ergo ${TAG#v}"
            PRERELEASE=false
            DMG="Ergo-${TAG#v}.dmg"
          else
            TAG="build-${GITHUB_RUN_NUMBER}"
            NAME="Ergo ${MARKETING} (build ${GITHUB_RUN_NUMBER})"
            PRERELEASE=true
            DMG="Ergo-${MARKETING}-build${GITHUB_RUN_NUMBER}.dmg"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      - name: 打包 DMG
        env:
          DMG: ${{ steps.version.outputs.dmg }}
        run: |
          ./scripts/make-dmg.sh build/Build/Products/Release/Ergo.app "dist/$DMG"
          (cd dist && shasum -a 256 "$DMG" | tee "$DMG.sha256")

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.dmg }}
          path: dist/*

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.name }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/*
          body: |
            ## 安装

            1. 打开 DMG，把 **Ergo** 拖进「应用程序」。
            2. 本构建使用 ad-hoc 签名（没有 Apple 开发者证书），首次打开会被 Gatekeeper 拦截。请在终端执行：

               ```sh
               xattr -dr com.apple.quarantine /Applications/Ergo.app
               ```

               然后再启动。
            3. 在 Ergo「设置 → 权限」里授予辅助功能、输入监控等权限。

            **注意**：ad-hoc 签名每次构建都不同，所以升级到新版本后，系统可能要求你重新授权辅助功能和输入监控（在系统设置里先移除旧的 Ergo 条目再添加）。

            系统要求：macOS 26 及以上。
