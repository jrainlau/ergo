name: Build & Release

# 版本号一律是 x.y.z，tag 也是 x.y.z（不带 v 前缀）。
# 推送到 main：版本为 <project.yml 的 MARKETING_VERSION 的 x.y>.<本次运行序号>，发布为正式版本。
# 推送 x.y.z 标签（如 0.2.0）：以标签为版本，发布为正式版本。
on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # xcode-27 是预装 Xcode 27 的 macOS 运行器（公开预览），与本地开发环境一致
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 计算版本号
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            PRERELEASE=false
          else
            BASE=$(grep -E '^\s+MARKETING_VERSION:' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
            VERSION="${BASE%.*}.${GITHUB_RUN_NUMBER}"
            PRERELEASE=false
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版本号必须是 x.y.z，得到：$VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=Ergo $VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "dmg=Ergo-$VERSION.dmg" >> "$GITHUB_OUTPUT"
          echo "版本：$VERSION（预发布：$PRERELEASE）"

      - name: 运行测试
        run: swift test --package-path Packages/ErgoKit

      - name: 生成工程
        run: xcodegen generate

      - name: 构建 Release（不签名）
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          xcodebuild \
            -project Ergo.xcodeproj \
            -scheme Ergo \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build

      - name: Ad-hoc 签名
        run: |
          APP="build/Build/Products/Release/Ergo.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: 打包 DMG
        env:
          DMG: ${{ steps.version.outputs.dmg }}
        run: |
          ./scripts/make-dmg.sh build/Build/Products/Release/Ergo.app "dist/$DMG"
          (cd dist && shasum -a 256 "$DMG" | tee "$DMG.sha256")

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.dmg }}
          path: dist/*

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.name }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/*
          body: |
            ## 安装

            1. 打开 DMG，**双击「安装 Ergo.command」**：它会把 Ergo 装进「应用程序」、解除 Gatekeeper 隔离并启动。
               （也可以先手动把 **Ergo** 拖进「应用程序」，再双击该脚本。）
            2. 本构建使用 ad-hoc 签名（没有 Apple 开发者证书），如不想用脚本，可手动在终端执行：

               ```sh
               xattr -dr com.apple.quarantine /Applications/Ergo.app
               ```
            3. 在 Ergo「设置 → 权限」里授予辅助功能、输入监控等权限。

            已安装的 Ergo 会每 6 小时检查一次新版本，并支持应用内自动更新（应用内更新不会触发“仍要打开”）。

            **注意**：ad-hoc 签名每次构建都不同，所以升级到新版本后，系统可能要求你重新授权辅助功能和输入监控（在系统设置里先移除旧的 Ergo 条目再添加）。

            系统要求：macOS 26 及以上。

      - name: 更新 versions.json
        # 应用内更新读取 versions 分支上的静态清单（走 CDN，不受 GitHub API 未登录限流影响）。
        # 清单由全部 Release 重新生成，所以并发或重跑都是幂等的。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/gen-versions.py "$GITHUB_REPOSITORY" > versions.json
          cat versions.json | head -40
          rm -rf /tmp/versions-branch && mkdir /tmp/versions-branch
          cp versions.json /tmp/versions-branch/
          cd /tmp/versions-branch
          git init -q -b versions
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -q -m "versions.json for ${{ steps.version.outputs.version }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" versions
